# GameDecides Configuration
# Author: TejasLamba2006

# Enable or disable the plugin
enabled: true

# Time between twist changes (in seconds)
twist-interval: 300  # 5 minutes

# Broadcast settings
broadcast:
  enabled: true
  # Use %twist% for twist name, %description% for description
  message: "&6&l⚡ TWIST CHANGE! &e%twist%"
  description-message: "&7%description%"
  sound: ENTITY_ENDER_DRAGON_GROWL
  sound-volume: 1.0
  sound-pitch: 1.0

# Messages
messages:
  prefix: "&6[GameDecides] &r"
  started: "&aGame twists have been started!"
  stopped: "&cGame twists have been stopped!"
  skipped: "&eSkipped to a new twist!"
  not-running: "&cGameDecides is not running!"
  already-running: "&cGameDecides is already running!"
  no-permission: "&cYou don't have permission to do that!"
  reload: "&aConfiguration reloaded!"

# Title display when twist changes
title:
  enabled: true
  fade-in: 10
  stay: 60
  fade-out: 20

