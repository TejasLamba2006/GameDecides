name: GameDecides
version: ${project.version}
main: com.github.tejaslamba2006.gamedecides.GameDecides
api-version: "1.21"
authors: [TejasLamba2006]
description: Random game-changing twists that keep gameplay exciting
website: https://modrinth.com/plugin/gamedecides
softdepend:
  - smp-core
commands:
  gamedecides:
    description: Main command for GameDecides
    usage: /<command> <start|stop|skip|list|info>
    permission: gamedecides.admin
    aliases: [gd, twists]
permissions:
  gamedecides.admin:
    description: Access to admin commands
    default: op
  gamedecides.bypass:
    description: Bypass twist effects
    default: false
